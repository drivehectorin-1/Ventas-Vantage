<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ventas Vantage - CRM Inmobiliario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 font-sans select-none">

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-2">
      <div class="bg-amber-500 text-slate-950 w-9 h-9 rounded-xl flex items-center justify-center font-black text-lg shadow">V</div>
      <div>
        <h1 class="font-bold text-base leading-tight">Ventas Vantage</h1>
        <p id="sync-status" class="text-[11px] text-emerald-400 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Conectando nube...
        </p>
      </div>
    </div>
    <div class="flex bg-slate-800 rounded-lg p-1 text-xs font-semibold">
      <button onclick="setRole('Hector')" id="btn-role-hector" class="px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 transition">Hector</button>
      <button onclick="setRole('Leandro')" id="btn-role-leandro" class="px-3 py-1.5 rounded-md text-slate-400 transition">Leandro</button>
    </div>
  </header>

  <!-- TABS PRINCIPALES -->
  <div class="max-w-xl mx-auto px-3 pt-3">
    <div class="grid grid-cols-3 gap-1.5 bg-slate-900 p-1.5 rounded-xl border border-slate-800 mb-4 text-xs font-bold">
      <button onclick="switchTab('calle')" id="tab-calle" class="py-2.5 rounded-lg bg-amber-500 text-slate-950 flex flex-col items-center gap-1">
        <i class="fa-solid fa-street-view text-sm"></i> 1. Calle / Casas
      </button>
      <button onclick="switchTab('compradores')" id="tab-compradores" class="py-2.5 rounded-lg text-slate-400 flex flex-col items-center gap-1">
        <i class="fa-solid fa-filter-circle-dollar text-sm"></i> 2. Compradores
      </button>
      <button onclick="switchTab('match')" id="tab-match" class="py-2.5 rounded-lg text-slate-400 flex flex-col items-center gap-1">
        <i class="fa-solid fa-bolt text-sm"></i> 3. Match Cierre
      </button>
    </div>

    <!-- SECCIÓN 1: CAPTACIÓN EN CALLE -->
    <div id="view-calle" class="space-y-3">
      <button onclick="openPropModal()" class="w-full bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-slate-950 font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base transition">
        <i class="fa-solid fa-plus-circle text-lg"></i> CAPTAR CASA EN CALLE
      </button>

      <!-- Filtros rápidos -->
      <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
        <button onclick="filterProps('todos')" class="px-3 py-1.5 rounded-full bg-slate-800 text-white whitespace-nowrap">Todas</button>
        <button onclick="filterProps('reacio')" class="px-3 py-1.5 rounded-full bg-red-950/70 text-red-300 border border-red-800/50 whitespace-nowrap">🔴 Dijo NO / Insistir</button>
        <button onclick="filterProps('por_grabar')" class="px-3 py-1.5 rounded-full bg-amber-950/70 text-amber-300 border border-amber-800/50 whitespace-nowrap">🟡 Por Grabar Video</button>
        <button onclick="filterProps('en_redes')" class="px-3 py-1.5 rounded-full bg-emerald-950/70 text-emerald-300 border border-emerald-800/50 whitespace-nowrap">🟢 Video en Redes</button>
      </div>

      <div id="props-list" class="space-y-3"></div>
    </div>

    <!-- SECCIÓN 2: COMPRADORES DE REDES -->
    <div id="view-compradores" class="space-y-3 hidden">
      <button onclick="openLeadModal()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base transition">
        <i class="fa-solid fa-user-plus text-lg"></i> REGISTRAR INTERESADO DE REDES
      </button>
      <div id="leads-list" class="space-y-3"></div>
    </div>

    <!-- SECCIÓN 3: MATCH AUTOMÁTICO Y CIERRES -->
    <div id="view-match" class="space-y-3 hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-300">
        <p class="font-bold text-amber-400 mb-1"><i class="fa-solid fa-handshake"></i> Cruce Inteligente de Cierres (Hector & Leandro)</p>
        Aquí aparecen automáticamente los compradores calificados (Contado o Crédito Aprobado) cuyo presupuesto alcanza para las casas que ya grabaron en video.
      </div>
      <div id="match-list" class="space-y-3"></div>
    </div>
  </div>

  <!-- MODAL NUEVA CASA -->
  <div id="modal-prop" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h2 class="font-black text-lg text-amber-400">Registrar Casa de Calle</h2>
        <button onclick="closePropModal()" class="text-slate-400 text-xl">&times;</button>
      </div>
      <input id="p-phone" type="tel" placeholder="Teléfono del letrero (Ej: 70012345)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-base text-white" />
      <input id="p-owner" type="text" placeholder="Nombre del Dueño (si lo dio)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white" />
      <div class="flex gap-2">
        <input id="p-zone" type="text" placeholder="Zona / Calle / Referencia" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white" />
        <button onclick="getGPS()" type="button" class="bg-slate-800 px-3 rounded-xl text-amber-400 border border-slate-700 text-xs font-bold shrink-0">
          <i class="fa-solid fa-location-crosshairs"></i> GPS
        </button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <input id="p-price" type="number" placeholder="Precio aprox ($us)" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white" />
        <select id="p-status" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white">
          <option value="no_contesto">⚪ No contestó</option>
          <option value="reacio">🔴 Reacio / Dijo NO</option>
          <option value="por_grabar">🟡 Por grabar con dueño</option>
          <option value="en_redes">🟢 Video ya en redes</option>
        </select>
      </div>
      <input id="p-followup" type="date" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-300" />
      <textarea id="p-notes" rows="2" placeholder="Notas (Ej: Llamar en 2 semanas, dueño vive ahí...)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white"></textarea>
      <button onclick="saveProp()" class="w-full bg-amber-500 text-slate-950 font-black py-3.5 rounded-xl text-base">GUARDAR CASA</button>
    </div>
  </div>

  <!-- MODAL NUEVO COMPRADOR -->
  <div id="modal-lead" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h2 class="font-black text-lg text-emerald-400">Nuevo Interesado (Redes)</h2>
        <button onclick="closeLeadModal()" class="text-slate-400 text-xl">&times;</button>
      </div>
      <input id="l-name" type="text" placeholder="Nombre del Comprador" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white" />
      <input id="l-phone" type="tel" placeholder="WhatsApp / Teléfono" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-base text-white" />
      <div class="grid grid-cols-2 gap-2">
        <input id="l-budget" type="number" placeholder="Presupuesto Máx ($us)" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white" />
        <select id="l-pay" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white">
          <option value="Contado">💵 Al Contado</option>
          <option value="Crédito Aprobado">🏦 Crédito Aprobado</option>
          <option value="Sin Calificar">❓ Sin Calificar aún</option>
        </select>
      </div>
      <select id="l-stage" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white">
        <option value="pregunto">1. Preguntó por video</option>
        <option value="filtrado">2. Filtrado (Tiene plata / Crédito)</option>
        <option value="leandro">3. Pasa a Leandro (Por Cerrar / Visita)</option>
        <option value="vendido">4. ¡Cerrado / Vendido!</option>
      </select>
      <textarea id="l-notes" rows="2" placeholder="¿Por cuál video preguntó? ¿Qué zona busca?" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white"></textarea>
      <button onclick="saveLead()" class="w-full bg-emerald-500 text-slate-950 font-black py-3.5 rounded-xl text-base">GUARDAR COMPRADOR</button>
    </div>
  </div>

  <!-- FIREBASE & LÓGICA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAGlEzpmW8D-dtBh8Cf1fig61nOVcHLmmw",
      authDomain: "ventas-vantage.firebaseapp.com",
      projectId: "ventas-vantage",
      storageBucket: "ventas-vantage.firebasestorage.app",
      messagingSenderId: "12616009851",
      appId: "1:12616009851:web:d0c4ca29560a07fd237ade",
      measurementId: "G-9C8E76PS7Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentRole = localStorage.getItem("vantage_role") || "Hector";
    let properties = [];
    let leads = [];
    let currentFilter = "todos";
    let gpsCoords = "";

    window.setRole = (role) => {
      currentRole = role;
      localStorage.setItem("vantage_role", role);
      document.getElementById("btn-role-hector").className = role === "Hector"
        ? "px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 transition"
        : "px-3 py-1.5 rounded-md text-slate-400 transition";
      document.getElementById("btn-role-leandro").className = role === "Leandro"
        ? "px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 transition"
        : "px-3 py-1.5 rounded-md text-slate-400 transition";
    };

    // Inicializar botón activo según quién lo dejó marcado en su celular
    window.setRole(currentRole);

    signInAnonymously(auth).then(() => {
      document.getElementById("sync-status").innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> En vivo (Nube activa)';
      initListeners();
    }).catch((err) => {
      document.getElementById("sync-status").innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400"></span> Modo Local (Activar Firestore)';
      console.error(err);
    });

    function initListeners() {
      onSnapshot(collection(db, "properties"), (snap) => {
        properties = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
        renderProps();
        renderMatch();
      });
      onSnapshot(collection(db, "leads"), (snap) => {
        leads = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
        renderLeads();
        renderMatch();
      });
    }

    window.switchTab = (tab) => {
      ["calle", "compradores", "match"].forEach(t => {
        document.getElementById("view-" + t).classList.toggle("hidden", t !== tab);
        document.getElementById("tab-" + t).className = t === tab
          ? "py-2.5 rounded-lg bg-amber-500 text-slate-950 flex flex-col items-center gap-1"
          : "py-2.5 rounded-lg text-slate-400 flex flex-col items-center gap-1";
      });
    };

    window.openPropModal = () => document.getElementById("modal-prop").classList.remove("hidden");
    window.closePropModal = () => document.getElementById("modal-prop").classList.add("hidden");
    window.openLeadModal = () => document.getElementById("modal-lead").classList.remove("hidden");
    window.closeLeadModal = () => document.getElementById("modal-lead").classList.add("hidden");

    window.getGPS = () => {
      if (!navigator.geolocation) return alert("GPS no disponible");
      navigator.geolocation.getCurrentPosition(pos => {
        gpsCoords = `${pos.coords.latitude},${pos.coords.longitude}`;
        const z = document.getElementById("p-zone");
        if (!z.value) z.value = "Ubicación GPS guardada";
        alert("¡Ubicación GPS capturada!");
      });
    };

    window.saveProp = async () => {
      const phone = document.getElementById("p-phone").value.trim();
      if (!phone) return alert("Escribe al menos el teléfono del cartel");
      await addDoc(collection(db, "properties"), {
        phone,
        owner: document.getElementById("p-owner").value.trim() || "Dueño directo",
        zone: document.getElementById("p-zone").value.trim() || "Sin zona",
        price: Number(document.getElementById("p-price").value) || 0,
        status: document.getElementById("p-status").value,
        followup: document.getElementById("p-followup").value,
        notes: document.getElementById("p-notes").value.trim(),
        gps: gpsCoords,
        by: currentRole,
        createdAt: Date.now()
      });
      gpsCoords = "";
      ["p-phone","p-owner","p-zone","p-price","p-followup","p-notes"].forEach(id => document.getElementById(id).value = "");
      closePropModal();
    };

    window.saveLead = async () => {
      const name = document.getElementById("l-name").value.trim();
      const phone = document.getElementById("l-phone").value.trim();
      if (!name || !phone) return alert("Pon el nombre y teléfono del interesado");
      await addDoc(collection(db, "leads"), {
        name, phone,
        budget: Number(document.getElementById("l-budget").value) || 0,
        pay: document.getElementById("l-pay").value,
        stage: document.getElementById("l-stage").value,
        notes: document.getElementById("l-notes").value.trim(),
        by: currentRole,
        createdAt: Date.now()
      });
      ["l-name","l-phone","l-budget","l-notes"].forEach(id => document.getElementById(id).value = "");
      closeLeadModal();
    };

    window.changePropStatus = async (id, status) => {
      await updateDoc(doc(db, "properties", id), { status });
    };

    window.changeLeadStage = async (id, stage) => {
      await updateDoc(doc(db, "leads", id), { stage });
    };

    window.removeDoc = async (col, id) => {
      if (confirm("¿Eliminar este registro?")) await deleteDoc(doc(db, col, id));
    };

    window.filterProps = (f) => { currentFilter = f; renderProps(); };

    function formatAuthor(by) {
      if (!by) return "Hector";
      if (by.includes("Yo")) return "Hector";
      if (by.includes("Socio")) return "Leandro";
      return by;
    }

    function renderProps() {
      const box = document.getElementById("props-list");
      const list = currentFilter === "todos" ? properties : properties.filter(p => p.status === currentFilter);
      if (!list.length) {
        box.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">No hay casas en esta vista. ¡Toca el botón amarillo para captar una!</div>`;
        return;
      }
      const badge = {
        no_contesto: "bg-slate-800 text-slate-300",
        reacio: "bg-red-950 text-red-300 border border-red-800",
        por_grabar: "bg-amber-950 text-amber-300 border border-amber-800",
        en_redes: "bg-emerald-950 text-emerald-300 border border-emerald-800"
      };
      box.innerHTML = list.map(p => {
        const cleanPhone = p.phone.replace(/\D/g, "");
        const author = formatAuthor(p.by);
        const msg = encodeURIComponent(`Hola ${p.owner}, soy ${currentRole}. Vi su propiedad en venta en ${p.zone}. Trabajo filtrando compradores al contado o con crédito aprobado y grabando un video con usted para venderla rápido sin llevarle curiosos. ¿Podemos conversar?`);
        return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow">
          <div class="flex justify-between items-start">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold ${badge[p.status]}">${p.status.replace("_"," ").toUpperCase()}</span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-amber-400 font-semibold">Captó: ${author}</span>
              </div>
              <h3 class="font-bold text-base mt-1">${p.zone}</h3>
              <p class="text-xs text-slate-400"><i class="fa-solid fa-user"></i> ${p.owner} • ${p.price ? '$'+p.price.toLocaleString() : 'Sin precio'}</p>
            </div>
            <button onclick="removeDoc('properties','${p.id}')" class="text-slate-600 hover:text-red-400 text-sm"><i class="fa-solid fa-trash"></i></button>
          </div>
          ${p.notes ? `<p class="text-xs bg-slate-950 p-2.5 rounded-xl text-slate-300 border border-slate-800">${p.notes}</p>` : ""}
          ${p.followup ? `<p class="text-xs text-amber-400 font-semibold"><i class="fa-regular fa-calendar"></i> Volver a llamar: ${p.followup}</p>` : ""}
          <div class="grid grid-cols-4 gap-1 text-[10px] font-bold pt-1">
            <button onclick="changePropStatus('${p.id}','no_contesto')" class="py-1.5 rounded bg-slate-800">⚪ No cont.</button>
            <button onclick="changePropStatus('${p.id}','reacio')" class="py-1.5 rounded bg-red-950 text-red-300">🔴 Reacio</button>
            <button onclick="changePropStatus('${p.id}','por_grabar')" class="py-1.5 rounded bg-amber-950 text-amber-300">🟡 Grabar</button>
            <button onclick="changePropStatus('${p.id}','en_redes')" class="py-1.5 rounded bg-emerald-950 text-emerald-300">🟢 Redes</button>
          </div>
          <div class="flex gap-2 pt-1">
            <a href="tel:${cleanPhone}" class="flex-1 bg-slate-800 hover:bg-slate-700 text-center py-2.5 rounded-xl text-xs font-bold"><i class="fa-solid fa-phone"></i> Llamar</a>
            <a href="https://wa.me/${cleanPhone}?text=${msg}" target="_blank" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-center py-2.5 rounded-xl text-xs font-bold"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            ${p.gps ? `<a href="https://www.google.com/maps?q=${p.gps}" target="_blank" class="bg-blue-950 text-blue-300 px-3 py-2.5 rounded-xl text-xs font-bold"><i class="fa-solid fa-map-pin"></i></a>` : ""}
          </div>
        </div>`;
      }).join("");
    }

    function renderLeads() {
      const box = document.getElementById("leads-list");
      if (!leads.length) {
        box.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">Aún no hay compradores registrados.</div>`;
        return;
      }
      box.innerHTML = leads.map(l => {
        const cleanPhone = l.phone.replace(/\D/g, "");
        const author = formatAuthor(l.by);
        const stageLabel = (l.stage === "socio" || l.stage === "leandro") ? "CON LEANDRO (CIERRE)" : l.stage.toUpperCase();
        return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2.5">
          <div class="flex justify-between">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 font-bold">${l.pay}</span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-amber-400 font-semibold">Registró: ${author}</span>
              </div>
              <h3 class="font-bold text-base mt-1">${l.name}</h3>
              <p class="text-xs text-slate-400">Presupuesto: <b>$${(l.budget||0).toLocaleString()}</b> • Etapa: <b>${stageLabel}</b></p>
            </div>
            <button onclick="removeDoc('leads','${l.id}')" class="text-slate-600 hover:text-red-400 text-sm"><i class="fa-solid fa-trash"></i></button>
          </div>
          ${l.notes ? `<p class="text-xs bg-slate-950 p-2 rounded-lg text-slate-300">${l.notes}</p>` : ""}
          <div class="grid grid-cols-3 gap-1 text-[10px] font-bold">
            <button onclick="changeLeadStage('${l.id}','filtrado')" class="py-1.5 rounded bg-slate-800">✅ Filtrado</button>
            <button onclick="changeLeadStage('${l.id}','leandro')" class="py-1.5 rounded bg-amber-600 text-slate-950">🔥 Pasar a Leandro</button>
            <button onclick="changeLeadStage('${l.id}','vendido')" class="py-1.5 rounded bg-emerald-600 text-white">🏆 Vendido</button>
          </div>
          <div class="flex gap-2 pt-1">
            <a href="tel:${cleanPhone}" class="flex-1 bg-slate-800 text-center py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-phone"></i> Llamar</a>
            <a href="https://wa.me/${cleanPhone}" target="_blank" class="flex-1 bg-emerald-600 text-white text-center py-2 rounded-xl text-xs font-bold"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
          </div>
        </div>`;
      }).join("");
    }

    function renderMatch() {
      const box = document.getElementById("match-list");
      const readyLeads = leads.filter(l => l.pay !== "Sin Calificar" || l.stage === "socio" || l.stage === "leandro" || l.stage === "filtrado");
      const activeProps = properties.filter(p => p.status === "en_redes" || p.status === "por_grabar");
      if (!readyLeads.length || !activeProps.length) {
        box.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">Cuando tengas casas en "Grabar/Redes" y compradores con presupuesto calificado, aquí verás los cruces automáticos para cerrar.</div>`;
        return;
      }
      let html = "";
      readyLeads.forEach(l => {
        const matches = activeProps.filter(p => !p.price || !l.budget || p.price <= l.budget * 1.15);
        matches.forEach(p => {
          const cleanPhone = l.phone.replace(/\D/g, "");
          const msg = encodeURIComponent(`Hola ${l.name}, te saluda ${currentRole}. Tengo disponible la propiedad en ${p.zone} (${p.price ? '$'+p.price.toLocaleString() : 'excelente precio'}) de trato directo con el propietario. ¿Coordinamos visita?`);
          html += `
          <div class="bg-slate-900 border border-amber-500/40 rounded-2xl p-3.5 space-y-2">
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-amber-400"><i class="fa-solid fa-bolt"></i> MATCH PARA CIERRE</span>
              <span class="text-emerald-400 font-bold">${l.pay}</span>
            </div>
            <p class="text-sm font-bold">${l.name} (Hasta $${(l.budget||0).toLocaleString()})</p>
            <p class="text-xs text-slate-300">👉 Casa: <b>${p.zone}</b> (${p.price ? '$'+p.price.toLocaleString() : 'Consultar'}) - Dueño: ${p.owner}</p>
            <a href="https://wa.me/${cleanPhone}?text=${msg}" target="_blank" class="block w-full bg-amber-500 text-slate-950 text-center font-black py-2.5 rounded-xl text-xs">
              <i class="fa-brands fa-whatsapp"></i> MANDAR PROPUESTA DE VISITA
            </a>
          </div>`;
        });
      });
      box.innerHTML = html || `<div class="text-center py-8 text-slate-500 text-xs">No hay coincidencias de precio aún.</div>`;
    }
  </script>
</body>
</html>
